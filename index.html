<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Ruletita</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="unnamed">
    <main class="stage">
        <div class="wheel-area">
            <canvas id="wheel-canvas"></canvas>
        </div>

        <section class="panel">
            <div class="brand">La Ruletita</div>
            <h1 id="wheel-name">La Ruletita</h1>
            <p id="status-text">Waiting for your phone&hellip;</p>
            <div id="result" class="result" hidden>
                <div class="result-title">Chosen</div>
                <div id="winner-label"></div>
            </div>
        </section>
    </main>

    <!-- Google Cast Receiver SDK v3 -->
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="js/wheel-renderer.js"></script>
    <script src="js/spin-animation.js"></script>
    <script src="js/receiver.js"></script>
</body>
</html>
